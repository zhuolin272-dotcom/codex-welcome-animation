<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Codex Welcome · 个人欢迎动画</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f6f2;color:#242527;font-family:'Segoe UI',system-ui,sans-serif}body{transition:background .7s,color .7s}body.dark{background:#141518;color:#f0eee9}iframe{position:absolute;left:50%;top:50%;width:1920px;height:1080px;border:0;transform-origin:center;z-index:0}.chrome{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:32px 42px;font-size:12px;letter-spacing:.13em}.identity{display:flex;gap:12px;align-items:center}.dot{height:6px;width:6px;border-radius:50%;background:#8c9489}.edition{font-size:10px;opacity:.4;letter-spacing:.2em}.bottom{position:absolute;z-index:2;bottom:28px;left:0;width:100%;display:flex;align-items:center;flex-direction:column;gap:17px}.controls{display:flex;gap:5px;padding:5px;background:#ffffff80;border:1px solid #2425270d;border-radius:30px;backdrop-filter:blur(16px);box-shadow:0 5px 30px #24252705}.dark .controls{background:#22232690;border-color:#ffffff12}button{font:400 12px 'Segoe UI',system-ui,sans-serif;border:0;background:transparent;color:inherit;border-radius:24px;padding:11px 19px;cursor:pointer;transition:background .2s}button:hover{background:#88888818}button:focus-visible{outline:2px solid #4665b8;outline-offset:2px}.hint{font-size:10px;letter-spacing:.11em;opacity:.4}.sep{width:1px;height:18px;background:#88888820;align-self:center;margin:0 2px}.label{font-weight:500}body.full .chrome,body.full .bottom{display:none}@media(max-width:600px){.chrome{padding:24px}.edition{display:none}.hint{font-size:9px}.bottom{bottom:24px}}
iframe{left:0;top:0;width:100%;height:100%;transform:none}
dialog{width:min(420px,calc(100vw - 32px));border:1px solid #8883;border-radius:22px;padding:28px;background:#f7f6f2;color:#242527;box-shadow:0 24px 80px #0002}dialog::backdrop{background:#181a2040;backdrop-filter:blur(8px)}.dark dialog{background:#222326;color:#f0eee9}dialog h2{font-size:20px;letter-spacing:0;margin:0 0 20px}dialog label{display:block;font-size:13px;margin-bottom:10px}dialog input{width:100%;font:inherit;font-size:20px;padding:12px;border-radius:10px;border:1px solid #8885;background:transparent;color:inherit}dialog p{font-size:12px;line-height:1.7;opacity:.7}dialog .actions{display:flex;justify-content:flex-end;margin-top:18px}#name-error{min-height:1.5em;color:#bd3e31;opacity:1}.controls{flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 32px)}
</style></head><body><iframe id="film" title="welcome JimmSun 手写开场动画" src="about:blank"></iframe><div class="chrome"><div class="identity"><span class="dot"></span><span><span id="display-name">JimmSun</span> <span style="opacity:.35">/</span> <span style="opacity:.55">Codex</span></span></div><span class="edition">CODEX WELCOME · 5.1 / 8.1</span></div><div class="bottom"><div class="controls"><button id="replay" class="label" title="空格重播">↻ &nbsp;重播</button><span class="sep"></span><button id="theme" aria-pressed="false">◐ &nbsp;深色</button><button id="speed" aria-pressed="false">8.1s &nbsp;完整</button><button id="name-settings">✎ &nbsp;名字</button><button id="full" title="全屏播放">⛶ &nbsp;全屏</button></div><div class="hint">为每一个新想法，留一个温柔的开始。</div></div><dialog id="name-dialog"><form id="name-form"><h2>让欢迎词属于你</h2><label for="welcome-name">动画中的名字</label><input id="welcome-name" name="name" maxlength="40" autocomplete="nickname" required><p>1–20 个字符。英文字母连笔书写，中文平滑显字。<br>这里只修改网页预览；桌面启动器请使用 Codex Settings。</p><p id="name-error" role="alert"></p><div class="actions"><button type="button" id="cancel-name">取消</button><button type="submit">保存并预览</button></div></form></dialog><script src="personalize.js"></script><script>
const frame=document.getElementById('film');const post=m=>frame.contentWindow.postMessage(m,'*');const query=new URLSearchParams(location.search);let dark=false,quick=query.get('variant')!=='full';
let displayName;try{displayName=CWPersonalization.validate(query.get('name')||CWPersonalization.saved()||'JimmSun')}catch(_){displayName='JimmSun'}
function loadFilm(){const params=new URLSearchParams({play:'1',variant:quick?'fast':'full',name:displayName,theme:dark?'dark':'light'});frame.src='animation.html?'+params;frame.title='welcome '+displayName+' 欢迎动画';document.getElementById('display-name').textContent=displayName}
loadFilm();document.getElementById('speed').textContent=quick?'5.1s  推荐':'8.1s  完整';document.getElementById('speed').setAttribute('aria-pressed',quick);
document.getElementById('replay').onclick=()=>post({type:'replay'});
document.getElementById('theme').onclick=e=>{dark=!dark;document.body.classList.toggle('dark',dark);post({type:'theme',dark});e.currentTarget.textContent=dark?'◑  浅色':'◐  深色';e.currentTarget.setAttribute('aria-pressed',dark);post({type:'replay'})};
document.getElementById('speed').onclick=e=>{quick=!quick;post({type:'speed',speed:quick?1.6:1});e.currentTarget.textContent=quick?'5.1s  快速':'8.1s  完整';e.currentTarget.setAttribute('aria-pressed',quick);post({type:'replay'})};
document.getElementById('full').onclick=async()=>{document.body.classList.add('full');await document.documentElement.requestFullscreen().catch(()=>{});post({type:'replay'})};
const dialog=document.getElementById('name-dialog'),nameInput=document.getElementById('welcome-name'),nameError=document.getElementById('name-error');
document.getElementById('name-settings').onclick=()=>{nameInput.value=displayName;nameError.textContent='';dialog.showModal();nameInput.select()};
document.getElementById('cancel-name').onclick=()=>dialog.close();
document.getElementById('name-form').onsubmit=e=>{e.preventDefault();try{displayName=CWPersonalization.save(nameInput.value);dialog.close();loadFilm()}catch(error){nameError.textContent=error.message;nameInput.focus()}};
addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('full')});addEventListener('keydown',e=>{if(e.target.closest('input,textarea,dialog'))return;if(e.code==='Space'){e.preventDefault();post({type:'replay'})}if(e.code==='Escape')document.body.classList.remove('full')});
</script></body></html>
